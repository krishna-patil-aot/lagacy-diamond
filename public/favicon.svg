<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Obsidian Luxury Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141210" />
      <stop offset="50%" stop-color="#090807" />
      <stop offset="100%" stop-color="#1a1614" />
    </linearGradient>

    <!-- Sovereign Gold Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8" />
    </linearGradient>

    <!-- Diamond Crown Facet Gradient -->
    <linearGradient id="facetTable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <!-- Diamond Pavilion Facet Gradient -->
    <linearGradient id="facetBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Diamond Wing Facets Gradient -->
    <linearGradient id="facetWings" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="auraGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#090807" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Luxury Obsidian Rounded Base Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="1.75" />

  <!-- Radial Golden Aura -->
  <circle cx="32" cy="30" r="22" fill="url(#auraGlow)" />

  <!-- High-Precision Diamond Solitaire Geometry -->
  <g transform="translate(0, 1)">
    <!-- Crown Table (Top horizontal facet) -->
    <polygon points="23,20 41,20 37,27 27,27" fill="url(#facetTable)" />

    <!-- Crown Left Upper Facet -->
    <polygon points="16,27 23,20 27,27" fill="url(#facetWings)" opacity="0.9" />

    <!-- Crown Right Upper Facet -->
    <polygon points="41,20 48,27 37,27" fill="url(#facetWings)" opacity="0.9" />

    <!-- Center Pavilion Heart Facet -->
    <polygon points="27,27 37,27 32,46" fill="url(#facetTable)" opacity="0.95" />

    <!-- Pavilion Left Lower Facet -->
    <polygon points="16,27 27,27 32,46" fill="url(#facetBody)" />

    <!-- Pavilion Right Lower Facet -->
    <polygon points="37,27 48,27 32,46" fill="url(#facetBody)" opacity="0.85" />

    <!-- Inner Facet Refraction Accent Lines -->
    <line x1="23" y1="20" x2="32" y2="46" stroke="#fef3c7" stroke-width="0.75" stroke-opacity="0.5" />
    <line x1="41" y1="20" x2="32" y2="46" stroke="#fef3c7" stroke-width="0.75" stroke-opacity="0.5" />

    <!-- Solar Twinkle Reflection Flare on Table -->
    <path d="M 23,20 Q 23,17 23,14 Q 23,17 23,20 Q 20,20 17,20 Q 20,20 23,20 Q 23,23 23,26 Q 23,23 23,20 Q 26,20 29,20 Q 26,20 23,20 Z" fill="#ffffff" opacity="0.95" />
    <circle cx="23" cy="20" r="1.5" fill="#ffffff" />
  </g>
</svg>
